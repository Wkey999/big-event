# Private preview before domain/filing: access with an SSH tunnel to port 80.
# This intentionally does NOT listen on a public interface.
server {
    listen 127.0.0.1:80;
    server_name localhost;
    root /var/www/boom;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        # Trailing slash strips /api/, matching the existing Vite proxy.
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Single direct Nginx entry: overwrite user-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location = /api { return 404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location /avatars/ { try_files $uri =404; }
    location /games/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
