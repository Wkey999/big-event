spring:
  profiles:
    # 默认激活开发环境；部署时用 --spring.profiles.active=prod 覆盖
    active: dev
  config:
    import:
      # Secrets stay outside classpath/JAR in ignored files at the repository root.
      - optional:file:./application-oss.yml
      - optional:file:./application-secret.yml
      # 大模型配置/API Key 从项目根目录的 gitignored 外部文件读取，避免进入 classpath/JAR。
      - optional:file:./application-llm.yml
  ai:
    # Starter 1.0.9 enables model autoconfigurations by default; explicitly turn off every
    # model type. The ignored local application-llm.yml enables chat only when configured.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.itheima.pojo
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # secret 见 application-secret.yml
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "
