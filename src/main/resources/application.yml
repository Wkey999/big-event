spring:
  profiles:
    # 默认激活开发环境；部署时用 --spring.profiles.active=prod 覆盖
    active: dev
  config:
    import:
      # Secrets stay outside classpath/JAR in ignored files at the repository root.
      - optional:file:./application-oss.yml
      - optional:file:./application-secret.yml
      # 大模型配置/API Key 从项目根目录的 gitignored 外部文件读取，避免进入 classpath/JAR。
      - optional:file:./application-llm.yml
      - optional:file:./application-ai-trial.yml
  ai:
    # Starter 1.0.9 enables model autoconfigurations by default; explicitly turn off every
    # model type. The ignored local application-llm.yml enables chat only when configured.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.itheima.pojo
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # secret 见 application-secret.yml
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

app:
  document-assistant:
    # Local Python sidecar; opt in after starting it on 127.0.0.1:8001.
    enabled: ${APP_DOCUMENT_ASSISTANT_ENABLED:false}
    base-url: http://127.0.0.1:8001
  leaderboard:
    # Apply migration 013 before enabling. Daily 04:20 in the configured zone;
    # a failed dimension may retry twice at least five minutes apart.
    sync-enabled: ${APP_LEADERBOARD_SYNC_ENABLED:false}
    sync-cron: ${APP_LEADERBOARD_SYNC_CRON:0 20 4 * * *}
    time-zone: ${APP_LEADERBOARD_TIME_ZONE:Asia/Shanghai}
    connect-timeout: ${APP_LEADERBOARD_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_LEADERBOARD_READ_TIMEOUT:12s}
    retry-check-ms: 300000
    retry-initial-delay-ms: 60000
  auth:
    token-revocation:
      # Enable only after Redis is running. Enabled mode rejects requests if Redis is unavailable.
      enabled: ${AUTH_TOKEN_REVOCATION_ENABLED:false}
  ai-trial:
    # Requires migration 009 and a dedicated trial key, independent of server translation.
    enabled: ${AI_TRIAL_ENABLED:false}
    daily-user-limit: 3
    daily-ip-limit: 10
    daily-site-limit: 100
    model: deepseek-flash
    api-key: ${AI_TRIAL_API_KEY:}
  llm:
    # Legacy server-key probe is private, opt-in and administrator-only.
    dev-probe-enabled: false
  content-feeds:
    # Requires migrations 006-012. Only explicit official sources can auto-publish link cards.
    enabled: true
    interval-ms: 1800000
    initial-delay-ms: 60000
    max-new-per-source: 8
    max-age-days: 30
    max-new-per-day: 120
    max-new-per-source-per-day: 30
    auto-publish-enabled: ${APP_CONTENT_FEEDS_AUTO_PUBLISH_ENABLED:true}
    auto-publish-sources: [github, deepseek_github]
